name: Tumblbug
description: 'Tumblbug (텀블벅) is a South Korean reward-based crowdfunding platform for creators, where
  makers launch projects and backers pledge funds to bring creative works — comics, games, publishing, design,
  music, film and more — to life. Surfaced as a portfolio company of DCM Ventures and added to the API Evangelist
  network for enrichment. As of this pass Tumblbug publishes a consumer-facing web platform (help center, creator
  guides, pricing/advertising, terms and privacy pages) but exposes no public developer API, documentation, or
  open API surface; this profile therefore carries identity and domain-security signals only.'
